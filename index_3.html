<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f5f5b">
<title>Agenda Clienti</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d2321; --muted:#6b736f; --line:#e6e2d9;
    --accent:#1f5f5b; --accent-soft:#e3eeec; --warn:#b4432f; --warn-soft:#f7e6e2;
    --amber:#c98a1b; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:Figtree,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 18px 10px;display:flex;align-items:center;gap:10px}
  header h1{font-size:24px;margin:0;font-weight:700;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back[hidden]{display:none}
  .back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
  .sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .sync i{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
  .sync.ok i{background:#3a9a6a}.sync.err i{background:var(--warn)}
  main{flex:1;padding:4px 16px 110px}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs .in{display:flex;width:100%;max-width:640px}
  nav.tabs button{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
  nav.tabs button svg{width:24px;height:24px}
  nav.tabs button.on{color:var(--accent)}
  .search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:12px;outline:none}
  .search:focus,.field input:focus,.field textarea:focus,.field select:focus,.addrow input:focus{border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
  .list{display:flex;flex-direction:column;gap:8px}
  .client{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
  .client .t{flex:1;min-width:0}
  .client .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .client .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:99px;flex:none}
  .fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:84px;z-index:9;width:58px;height:58px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(31,95,91,.35)}
  .fab svg{width:28px;height:28px}
  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
  .section{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between}
  .section button{text-transform:none;letter-spacing:0;font-size:14px;color:var(--accent);font-weight:600}
  .info{padding:14px}
  .info .row{display:flex;gap:10px;padding:6px 0;font-size:15px}
  .info .row span:first-child{color:var(--muted);width:78px;flex:none}
  .info .row span:last-child{word-break:break-word;white-space:pre-wrap}
  .info a{color:var(--accent)}
  .actions{display:flex;gap:8px;margin-top:10px}
  .btn{padding:11px 16px;border-radius:12px;font-weight:600;background:var(--accent);color:#fff}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:var(--warn-soft);color:var(--warn)}
  .btn.full{width:100%}
  .addrow{display:flex;gap:8px;margin-bottom:10px}
  .addrow input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
  .addrow input.qty{flex:0 0 74px}
  .addrow button{width:48px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
  .check{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .check:last-child{border-bottom:0}
  .box{width:26px;height:26px;border-radius:8px;border:2px solid #c9c3b6;flex:none;display:grid;place-items:center;color:#fff}
  .check.done .box{background:var(--accent);border-color:var(--accent)}
  .check .txt{flex:1;min-width:0;word-break:break-word}
  .check.done .txt{color:var(--muted);text-decoration:line-through}
  .check .q{font-size:13px;color:var(--muted);flex:none}
  .x{width:32px;height:32px;border-radius:10px;color:#a19a8c;display:grid;place-items:center;flex:none}
  .x:active{background:var(--warn-soft);color:var(--warn)}
  /* calendar */
  .calhead{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 6px}
  .calhead b{font-size:18px;text-transform:capitalize}
  .calhead button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px 8px 12px}
  .dow{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
  .day{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500;position:relative}
  .day.out{color:#c2bcb0}
  .day.today{color:var(--accent);font-weight:700}
  .day.sel{background:var(--accent);color:#fff}
  .dots{display:flex;gap:2px;height:5px}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--amber)}
  .day.sel .dots i{background:#fff}
  .ev{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;text-align:left;width:100%}
  .ev .tm{font-weight:700;color:var(--accent);width:50px;flex:none;font-variant-numeric:tabular-nums}
  .ev .tt{flex:1;min-width:0}
  .ev .tt b{font-weight:600;display:block;word-break:break-word}
  .ev .tt small{color:var(--muted);font-size:13px;display:block;word-break:break-word}
  .ev .dt{font-size:12px;color:var(--muted)}
  .chip{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px;margin-top:4px;font-weight:600}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(20,25,23,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .sheet h2{margin:0 0 14px;font-size:20px}
  .field{display:block;margin-bottom:12px}
  .field span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
  .field textarea{min-height:80px;resize:vertical}
  .two{display:flex;gap:10px}.two .field{flex:1}
  .sheet .actions{margin-top:6px}
  .sheet .actions .btn{flex:1}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ph{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--line);padding:0}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:11px;padding:14px 6px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .preview{width:100%;max-height:45vh;object-fit:contain;border-radius:12px;background:#000;display:block;margin-bottom:12px}
  .opt{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:15px}
  .opt input{width:20px;height:20px;accent-color:var(--accent)}
  .rv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .rv:last-child{border-bottom:0}
  .rv input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
  .rv input[type=text]{flex:1;min-width:0;border:0;background:transparent;padding:4px 0;outline:none}
  .rv .q{font-size:13px;color:var(--muted);flex:none;max-width:30%;text-align:right}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.9s linear infinite;margin:18px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .memo{background:#fdf6e3;border:1px solid #efdfb0;border-radius:var(--radius)}
  .memo .m{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid #efdfb0}
  .memo .m:last-child{border-bottom:0}
  .memo .m .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
  .memo .m small{display:block;color:#9a7a2a;font-size:12px;margin-top:2px}
  .btn.memo-btn{background:#fdf6e3;color:#7a5a12;border:1px solid #efdfb0}
  .lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .lock.hide{display:none}
  .lock .box2{width:100%;max-width:360px;text-align:center}
  .lock .ic{width:64px;height:64px;border-radius:20px;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto 16px}
  .lock h2{margin:0 0 6px;font-size:22px}
  .lock p{margin:0 0 18px;color:var(--muted);font-size:15px}
  .lock input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:none;font-size:18px;text-align:center;margin-bottom:10px}
  .lock input:focus{border-color:var(--accent)}
  .lock .err{color:var(--warn);font-size:14px;min-height:20px;margin:0 0 10px}
  .lock .btn{width:100%;padding:14px}
  .shake{animation:shk .35s}
  @keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .gear{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
  .when{flex:none;text-align:center;border-radius:12px;padding:6px 9px;min-width:64px;line-height:1.15}
  .when b{display:block;font-size:14px}
  .when small{font-size:11px;font-weight:600}
  .when.g{background:#dcefe2;color:#2f7a4b}
  .when.y{background:#fbefb9;color:#7a6110}
  .when.o{background:#fdd9b5;color:#a24a06}
  .legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:-4px 2px 10px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .fl{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
  .fl:last-child{border-bottom:0}
  .fl .fi{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--accent-soft);color:var(--accent)}
  .fl .fi.pdf{background:#f7e1dd;color:#b4432f}
  .fl .fn{flex:1;min-width:0}
  .fl .fn b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fl .fn small{color:var(--muted);font-size:12px}
  .vh{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
  label.btn{display:block;text-align:center;cursor:pointer}
  .fbtn{position:relative;overflow:hidden;display:block;text-align:center}
  .fbtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:200px;cursor:pointer;z-index:2}
  .client{cursor:pointer}
  .client .addr{display:inline-flex;align-items:center;gap:4px;max-width:100%;color:var(--accent);font-size:14px;font-weight:500;text-decoration:none;padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .client .addr svg{flex:none}
  .msgb{width:44px;height:44px;border-radius:14px;background:#25a35a;color:#fff;display:grid;place-items:center;flex:none}
  .msgb:active{opacity:.8}
  .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#1d2321;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="back" hidden aria-label="Indietro"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title">Clienti</h1>
    <div class="sync" id="sync"><i></i><span>Caricamento…</span></div>
    <button class="gear" id="gear" aria-label="Impostazioni"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
  </header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="Aggiungi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs"><div class="in">
  <button data-tab="clients" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>Clienti</button>
  <button data-tab="shopping"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H7"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Spesa</button>
  <button data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Mappa</button>
  <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendario</button>
</div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="lock" id="lock"><div class="box2" id="lockBox"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></div><h2>Agenda Clienti</h2><p>Caricamento…</p></div></div>
<input type="file" id="camIn" accept="image/*" capture="environment" class="vh">
<input type="file" id="galIn" accept="image/*" class="vh">
<input type="file" id="fileIn" class="vh">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";
/* ---------- state ---------- */
var KEYS = ["clients","shopping","events"];
var state = {clients:[], shopping:[], events:[]};
var view = {tab:"clients", clientId:null, q:"", month:null, sel:null};
var LS = "agendaClienti.v1";

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseYmd(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
var MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
var GIORNI=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
function fmtDate(s){ var d=parseYmd(s); return GIORNI[d.getDay()]+" "+d.getDate()+" "+MESI[d.getMonth()]; }
function fmtShort(s){ var d=parseYmd(s); return d.getDate()+" "+MESI[d.getMonth()].slice(0,3); }

try{ var cached = JSON.parse(localStorage.getItem(LS)||"null"); if(cached){ KEYS.forEach(function(k){ if(Array.isArray(cached[k])) state[k]=cached[k]; }); } }catch(e){}
var today = new Date(); view.month = new Date(today.getFullYear(), today.getMonth(), 1); view.sel = ymd(today);

/* ---------- sync with db ---------- */
var refs = {}, timers = {}, writing = {}, dirty = {}, loaded = {};
function setSync(cls, txt){ var el=document.getElementById("sync"); el.className="sync "+cls; el.querySelector("span").textContent=txt; }
function cacheLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function save(key){
  cacheLocal();
  if(!refs[key]) return;
  clearTimeout(timers[key]);
  timers[key] = setTimeout(function(){ timers[key]=null; flush(key); }, 500);
}
function flush(key){
  if(writing[key]){ dirty[key]=true; return; }
  writing[key]=true; setSync("", "Salvataggio…");
  refs[key].set({items: clone(state[key]), updated: Date.now()}).then(function(){
    setSync("ok","Salvato");
  }).catch(function(e){
    setSync("err", e && e.code==="quota_exceeded" ? "Spazio pieno" : "Non salvato");
  }).then(function(){
    writing[key]=false;
    if(dirty[key]){ dirty[key]=false; flush(key); }
  });
}
function busy(key){ return !!(timers[key] || writing[key] || dirty[key]); }

function startSync(){
  if(!window.claude || typeof window.claude.use!=="function"){ setSync("","Solo su questo telefono"); return; }
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db=r[0], user=r[1];
    if(!db || !user){ setSync("","Solo su questo telefono"); return; }
    return user.id().then(function(id){
      if(!id){ setSync("","Solo su questo telefono"); return; }
      var base = "data/users/"+id;
      setRef = db.doc(base+"/settings");
      setRef.onSnapshot(function(snap){
        if(snap.metadata.fromCache!==false && !snap.exists) return;
        var d = snap.exists ? snap.data() : null;
        if(d && d.tpl && !setWriting){ tpl=normTpl(d.tpl); cacheTpl(); }
        if(d && d.pwHash){ if(!pw || pw.pwHash!==d.pwHash || pw.salt!==d.salt){ pw={pwHash:d.pwHash, salt:d.salt}; cachePw(); } }
        else if(!d && pw && !setWriting){ writeSettings(); }
        setKnown=true; lockDecide();
      }, function(){ setKnown=true; lockDecide(); });
      var timeout = setTimeout(function(){ setSync("err","Offline"); }, 10000);
      KEYS.forEach(function(k){
        var ref = db.doc(base+"/"+k);
        ref.onSnapshot(function(snap){
          if(snap.metadata.fromCache===false){ clearTimeout(timeout); }
          if(!loaded[k] && snap.metadata.fromCache===false){
            loaded[k]=true;
            refs[k]=ref;
            if(!snap.exists){
              if(state[k].length) flush(k); // first time: upload what's on this phone
              setSync("ok","Sincronizzato");
              return;
            }
          }
          if(!refs[k]) refs[k]=ref;
          if(snap.metadata.hasPendingWrites || busy(k)) return;
          var d = snap.exists ? snap.data() : null;
          if(d && Array.isArray(d.items)){
            state[k] = clone(d.items); cacheLocal(); render();
          }
          setSync("ok","Sincronizzato");
        }, function(err){ clearTimeout(timeout); setSync("err","Non sincronizzato"); });
      });
    });
  }).catch(function(){ setSync("","Solo su questo telefono"); });
}

  ["L","M","M","G","V","S","D"].forEach(function(d){ h+='<div class="dow">'+d+'</div>'; });
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), s=ymd(d), n=(byDay[s]||[]).length;
    if(i===35 && d.getMonth()!==mo) break;
    h+='<button class="day'+(d.getMonth()!==mo?' out':'')+(s===todayS?' today':'')+(s===view.sel?' sel':'')+'" data-day="'+s+'">'+d.getDate()+'<span class="dots">'+(n?'<i></i>':'')+(n>1?'<i></i>':'')+(n>2?'<i></i>':'')+'</span></button>';
  }

function shrink(file, max){
  return new Promise(function(res){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var s=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
      var cv=document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*s); cv.height=Math.round(img.naturalHeight*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(function(b){ res(b||file); }, "image/jpeg", 0.82);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
function sampleErr(e){
  var c=e&&e.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared") return "La lettura delle foto non è stata autorizzata.";
  if(c==="rate_limited") return "Troppe richieste: riprova tra un po'.";
  if(c==="invalid_json"||c==="empty_completion") return "Non sono riuscito a leggere la foto. Prova con una foto più nitida.";
  if(c==="image_rejected") return "Questa immagine non va bene, provane un'altra.";
  if(c==="refused") return "Non è stato possibile leggere questa foto.";
  return "Errore di connessione. Riprova.";
}
function savePhoto(cid, blob, label){

    var c=client(cid); if(!c) return;
    c.photos=c.photos||[]; c.photos.push({id:r.id, date:ymd(new Date()), label:label||""});
    save("clients"); render();

}

      if(canRead && canSave) h+='<label class="opt"><input type="checkbox" id="keepP" checked>Salva anche la foto nella scheda del cliente</label>';
      h+='<div class="actions" style="flex-direction:column">'+

function readPhoto(cid, blob, url, sample, keep){
  var ctl=new AbortController();
  openSheet('<h2>Sto leggendo la foto…</h2><img class="preview" src="'+url+'" alt="" style="max-height:25vh"><div class="spin"></div><p style="text-align:center;color:var(--muted);margin:0 0 14px">Può volerci fino a un minuto.</p><div class="actions"><button class="btn ghost full" id="stopP" type="button">Annulla</button></div>');
  document.getElementById("stopP").onclick=function(){ ctl.abort(); closeSheet(); };
  var prompt='La foto allegata è una lista scritta (anche a mano) oppure una bolla di consegna / DDT / fattura. '+
    'Estrai le voci o gli articoli elencati, nell\'ordine in cui compaiono. '+
    'Per una bolla metti in "text" la descrizione dell\'articolo (con il codice se c\'è) e in "qty" quantità e unità (es. "3 pz", "2,5 kg"). '+
    'Ignora intestazioni, indirizzi, partita IVA, prezzi, totali, firme e note di trasporto. '+
    'Scrivi in italiano, correggendo solo errori evidenti di lettura. '+
    'Rispondi solo con JSON in questa forma: {"tipo":"lista" oppure "bolla","titolo":"breve titolo, es. \\"Bolla n. 123 del 12/11\\" oppure \\"Lista\\"","voci":[{"text":"...","qty":""}]}. '+
    'Se non trovi voci, "voci" è [].';
  sample.json(prompt,{images:blob, signal:ctl.signal}).then(function(res){
    var voci=(res && Array.isArray(res.voci)) ? res.voci : [];
    voci=voci.map(function(v){ return {text:String(v&&v.text||"").trim(), qty:String(v&&v.qty||"").trim()}; }).filter(function(v){return v.text;});
    var titolo=String(res&&res.titolo||"").trim().slice(0,60);
    if(keep) savePhoto(cid, blob, titolo).catch(function(){ toast("Foto non salvata"); });
    reviewItems(cid, voci, titolo);
  }).catch(function(e){
    if(e && e.code==="cancelled") return;
    openSheet('<h2>Non ci sono riuscito</h2><p>'+esc(sampleErr(e))+'</p><div class="actions"><button class="btn ghost" data-close type="button">Chiudi</button><button class="btn" id="retryP" type="button">Riprova</button></div>');
    document.getElementById("retryP").onclick=function(){ readPhoto(cid, blob, url, sample, keep); };
  });
}

function buildPdf(items){
  var J=window.jspdf && window.jspdf.jsPDF; if(!J) throw new Error("jspdf");
  var doc=new J({unit:"mm", format:"a4"}), W=210, M=20, y=0;
  var d=new Date(), dateTxt=GIORNI[d.getDay()]+" "+d.getDate()+" "+MESI[d.getMonth()]+" "+d.getFullYear();
  function header(first){
    doc.setFillColor(31,95,91); doc.rect(0,0,W,first?34:18,"F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold");
    if(first){
      doc.setFontSize(22); doc.text(PDF_TITLE, M, 17);
      doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.text(dateTxt.charAt(0).toUpperCase()+dateTxt.slice(1), M, 26);
      y=48;
    } else {
      doc.setFontSize(12); doc.text(PDF_TITLE+" (continua)", M, 11.5); y=30;
    }
    doc.setTextColor(29,35,33);
  }
  header(true);
  doc.setFontSize(10); doc.setTextColor(107,115,111); doc.setFont("helvetica","normal");
  doc.text(items.length+(items.length===1?" articolo":" articoli"), M, y-6); doc.setTextColor(29,35,33);
  items.forEach(function(it){
    var qtyW = it.qty ? doc.setFontSize(11).getTextWidth(it.qty)+4 : 0;
    doc.setFontSize(12);
    var lines=doc.splitTextToSize(it.text, W-2*M-10-qtyW);
    var hgt=Math.max(1,lines.length)*5.6+4.4;
    if(y+hgt>280){ doc.addPage(); header(false); }
    doc.setDrawColor(150,150,150); doc.setLineWidth(0.4); doc.roundedRect(M, y-4, 4.6, 4.6, 0.8, 0.8, "S");
    if(it.done){ doc.setDrawColor(31,95,91); doc.setLineWidth(0.7); doc.line(M+1,y-1.7,M+2,y-0.4); doc.line(M+2,y-0.4,M+3.8,y-3.2); }
    doc.setFont("helvetica","normal"); doc.setTextColor(it.done?140:29, it.done?140:35, it.done?140:33);
    doc.text(lines, M+9, y);
    if(it.qty){ doc.setFontSize(11); doc.setTextColor(31,95,91); doc.setFont("helvetica","bold"); doc.text(it.qty, W-M, y, {align:"right"}); }
    y+=hgt-3.2;
    doc.setDrawColor(230,226,217); doc.setLineWidth(0.2); doc.line(M, y, W-M, y);
    y+=6;
  });
  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){ doc.setPage(p); doc.setFontSize(9); doc.setTextColor(150,150,150); doc.setFont("helvetica","normal"); doc.text("Pagina "+p+" di "+n, W-M, 290, {align:"right"}); }
  return doc.output("blob");
}

function hashPw(p, salt){
  var data=salt+"|"+p;
  if(window.crypto && crypto.subtle && window.TextEncoder){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(data)).then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join(""); });
  }
  var h=5381; for(var i=0;i<data.length;i++){ h=((h<<5)+h+data.charCodeAt(i))|0; } return Promise.resolve("s"+(h>>>0).toString(16));
}
function newSalt(){ try{ var a=new Uint8Array(12); crypto.getRandomValues(a); return Array.from(a).map(function(x){return x.toString(16).padStart(2,"0");}).join(""); }catch(e){ return uid()+uid(); } }

/* --- file e foto: IndexedDB --- */
var IDBP=null;
function idb(){
  if(IDBP) return IDBP;
  IDBP=new Promise(function(res,rej){
    var r=indexedDB.open("agendaBlobs",1);
    r.onupgradeneeded=function(){ r.result.createObjectStore("blobs",{keyPath:"id"}); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
  });
  return IDBP;
}
function idbDo(mode, fn){
  return idb().then(function(db){ return new Promise(function(res,rej){
    var tx=db.transaction("blobs",mode), rq=fn(tx.objectStore("blobs")), out;
    if(rq) rq.onsuccess=function(){ out=rq.result; };
    tx.oncomplete=function(){ res(out); }; tx.onerror=function(){ rej(tx.error); }; tx.onabort=function(){ rej(tx.error); };
  }); });
}
var localAssets={
  upload:function(blob,o){
    var id=(uid()+uid()+uid()).replace(/[^a-z0-9]/g,"").slice(0,32), t=(o&&o.type)||blob.type||"application/octet-stream";
    var rec={id:id, blob:blob, type:t, size:blob.size, createdAt:new Date().toISOString()};
    return idbDo("readwrite",function(st){ return st.put(rec); }).then(function(){ return {id:id, url:"", sizeBytes:blob.size, contentType:t}; }, function(){ throw {code:"quota_or_state"}; });
  },
  delete:function(id){ return idbDo("readwrite",function(st){ return st.delete(id); }).then(function(){ return {deleted:true}; }); },
  list:function(){ return idbDo("readonly",function(st){ return st.getAll(); }).then(function(a){ return {assets:(a||[]).map(function(r){ return {id:r.id, contentType:r.type, sizeBytes:r.size, createdAt:r.createdAt}; }), usage:{}}; }); },
  get:function(id){ return idbDo("readonly",function(st){ return st.get(id); }); }
};
function mimeFor(n){ var e=(String(n).split(".").pop()||"").toLowerCase(); return {pdf:"application/pdf",json:"application/json",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",txt:"text/plain",mp4:"video/mp4"}[e]||"application/octet-stream"; }
function plainDownload(blob,name){
  var u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 5000);
  return Promise.resolve({status:"saved"});
}
var localDownloads={
  save:function(o){
    var blob = (o.data instanceof Blob) ? o.data : new Blob([o.data], {type:mimeFor(o.filename)});
    var file=null; try{ file=new File([blob], o.filename, {type:blob.type||mimeFor(o.filename)}); }catch(e){}
    if(file && navigator.canShare && navigator.share){
      var ok=false; try{ ok=navigator.canShare({files:[file]}); }catch(e){}
      if(ok) return navigator.share({files:[file], title:o.filename}).then(function(){ return {status:"saved"}; }, function(e){ if(e && e.name==="AbortError") throw {code:"declined"}; return plainDownload(blob,o.filename); });
    }
    return plainDownload(blob,o.filename);
  }
};
function cap(n){ return Promise.resolve(n==="assets" ? localAssets : n==="downloads" ? localDownloads : null); }

var blobURLs={};
function hydrateBlobs(){
  document.querySelectorAll("[data-bid]").forEach(function(el){
    if(el.dataset.hyd) return; el.dataset.hyd="1";
    var id=el.dataset.bid;
    if(blobURLs[id]){ el.src=blobURLs[id]; return; }
    localAssets.get(id).then(function(r){ if(!r) return; blobURLs[id]=blobURLs[id]||URL.createObjectURL(r.blob); el.src=blobURLs[id]; }).catch(function(){});
  });
}
new MutationObserver(hydrateBlobs).observe(document.body,{childList:true,subtree:true});

  var e=nextEvent(c.id), giorno="", ora="";
  if(e){ var dd=Math.round((parseYmd(e.date).getTime()-parseYmd(ymd(new Date())).getTime())/86400000); giorno = dd===0 ? "oggi" : dd===1 ? "domani" : fmtDate(e.date); ora=e.time||""; }
  return text.replace(/\{nome\}/g, c.name.trim()).replace(/\{firma\}/g, ownerName||"").replace(/\{giorno\}/g, giorno||"…")
    .replace(/\{ alle ora\}/g, ora ? " alle "+ora : "").replace(/\{ora\}/g, ora||"…");
}

/* --- mappa --- */
var lmap=null, geoBusy=false;
function clientLatLng(c){
  if(c.pos && c.pos.lat!=null) return c.pos;
  if(c.address && c.geo && c.geo.addr===c.address && c.geo.lat!=null) return c.geo;
  return null;
}
function geocodeMissing(done){
  if(geoBusy) return;
  var todo=state.clients.filter(function(c){ return c.address && !(c.pos && c.pos.lat!=null) && !(c.geo && c.geo.addr===c.address); });
  if(!todo.length) return;
  geoBusy=true;
  var i=0;
  (function next(){
    if(i>=todo.length){ geoBusy=false; save("clients"); if(done) done(); return; }
    var c=todo[i++], addr=c.address;
    fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(addr), {headers:{"Accept-Language":"it"}})
      .then(function(r){ return r.json(); })
      .then(function(a){ var cc=client(c.id); if(cc && cc.address===addr) cc.geo = (a&&a[0]) ? {addr:addr, lat:+(+a[0].lat).toFixed(6), lng:+(+a[0].lon).toFixed(6)} : {addr:addr, lat:null, lng:null}; })
      .catch(function(){})
      .then(function(){ setTimeout(next, 1100); });
  })();
}
function urgency(cid){
  var e=nextEvent(cid); if(!e) return null;
  var dd=Math.round((parseYmd(e.date).getTime()-parseYmd(ymd(new Date())).getTime())/86400000);
  return dd===0 ? "#e8731a" : dd<=2 ? "#d9b310" : "#2f9a5b";
}
function renderMap(){
  $title.textContent="Mappa";
  if(lmap){ try{ lmap.remove(); }catch(e){} lmap=null; }
  $main.innerHTML='<div id="map" style="height:calc(100vh - 230px);min-height:320px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#e8e4da"></div>'+
    '<div class="actions"><button class="btn ghost" id="meBtn" type="button" style="flex:1">'+ICON_PIN+'Dove sono io</button></div><p id="mapMsg" style="color:var(--muted);font-size:13px;margin:8px 2px 0"></p>';
  var msg=document.getElementById("mapMsg");
  if(!window.L){ msg.textContent="Per vedere la mappa serve la connessione a internet."; return; }
  lmap=L.map("map",{zoomControl:true}).setView([41.9,12.5],6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(lmap);
  var pts=[], senza=0;
  state.clients.forEach(function(c){
    var p=clientLatLng(c);
    if(!p){ if(c.address || c.pos) senza++; return; }
    var col=urgency(c.id)||"#6b736f";
    var m=L.circleMarker([p.lat,p.lng],{radius:11, color:"#fff", weight:3, fillColor:col, fillOpacity:1}).addTo(lmap);
    var e=nextEvent(c.id);
    m.bindPopup('<b style="font-size:15px">'+esc(c.name)+'</b>'+(c.address?'<br>'+esc(c.address):'')+(e?'<br><span style="color:'+col+';font-weight:700">'+esc(fmtShort(e.date))+(e.time?' '+esc(e.time):'')+'</span>':'')+
      '<br><a href="'+esc(mapsNav(clientLatLng(c)))+'" target="_blank" rel="noopener">Naviga</a> · <a href="#" data-open="'+c.id+'">Apri scheda</a>');
    pts.push([p.lat,p.lng]);
  });
  if(pts.length) lmap.fitBounds(pts,{padding:[30,30], maxZoom:15});
  var noAddr=state.clients.filter(function(c){ return !c.address && !(c.pos && c.pos.lat!=null); }).length;
  msg.textContent = pts.length+" clienti sulla mappa"+(noAddr?" · "+noAddr+" senza indirizzo":"")+(senza?" · "+senza+" indirizzi non trovati":"");
  if(state.clients.some(function(c){ return c.address && !(c.pos && c.pos.lat!=null) && !(c.geo && c.geo.addr===c.address); })){
    msg.textContent="Cerco gli indirizzi sulla mappa…";
    geocodeMissing(function(){ if(view.tab==="map") renderMap(); });
  }
  document.getElementById("meBtn").onclick=function(){
    if(!navigator.geolocation){ msg.textContent="Posizione non disponibile."; return; }
    msg.textContent="Cerco la tua posizione…";
    navigator.geolocation.getCurrentPosition(function(pos){
      if(!lmap) return;
      var ll=[pos.coords.latitude,pos.coords.longitude];
      L.circleMarker(ll,{radius:9,color:"#fff",weight:3,fillColor:"#2b6cd4",fillOpacity:1}).addTo(lmap).bindPopup("Sei qui");
      lmap.setView(ll,13); msg.textContent="";
    }, function(){ msg.textContent="Non riesco a leggere la posizione: controlla che il GPS sia acceso e che Chrome abbia il permesso."; }, {enableHighAccuracy:true, timeout:12000});
  };
  setTimeout(function(){ if(lmap) lmap.invalidateSize(); }, 200);
}
$main.addEventListener("click", function(ev){ var a=ev.target.closest('a[data-open]'); if(a){ ev.preventDefault(); view.tab="clients"; view.clientId=a.dataset.open; render(); window.scrollTo(0,0); } }, true);

/* --- primo avvio: nome + password --- */
function setupScreen(){
  unlocked=false;
  showLock('<h2>Benvenuto!</h2><p>Scrivi il tuo nome (comparirà nel PDF della spesa e nei messaggi) e crea una password di soli numeri.</p><form id="sf">'+
    '<input name="n" placeholder="Nome e cognome" autocomplete="name" value="'+esc(ownerName)+'">'+
    '<input type="password" inputmode="numeric" pattern="[0-9]*" name="a" placeholder="Nuova password" autocomplete="new-password">'+
    '<input type="password" inputmode="numeric" pattern="[0-9]*" name="b" placeholder="Ripeti la password" autocomplete="new-password">'+
    '<div class="err" id="serr"></div><button class="btn">Inizia</button></form>'+
    '<p style="margin-top:14px;font-size:13px">Hai un file di copia? Dopo l\'avvio lo importi da ⚙️ Impostazioni.</p>');
  document.getElementById("sf").onsubmit=function(e){
    e.preventDefault(); var n=this.n.value.trim(), a=this.a.value, b=this.b.value, err=document.getElementById("serr");
    if(!n){ err.textContent="Scrivi il tuo nome"; return; }
    if(a.length<4){ err.textContent="La password deve avere almeno 4 numeri"; return; }
    if(a!==b){ err.textContent="Le due password non sono uguali"; return; }
    setOwnerName(n);
    var salt=newSalt();
    hashPw(a, salt).then(function(h){ pw={pwHash:h, salt:salt}; cachePw(); unlock(); render(); toast("Benvenuto, "+n+"!"); });
  };
}
function resetAll(){
  try{ [LS, LS_PW, LS_NAME, "agendaClienti.tpl"].forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
  try{ indexedDB.deleteDatabase("agendaBlobs"); }catch(e){}
  setTimeout(function(){ location.reload(); }, 400);
}
function forgotScreen(){
  showLock('<h2>Password dimenticata</h2><p>La password non si può recuperare. Puoi solo azzerare l\'app: <b>verranno cancellati tutti i dati</b> su questo telefono. Se hai un file di copia, dopo potrai reimportarlo.</p>'+
    '<form id="rf"><input name="c" placeholder="Scrivi CANCELLA per confermare" autocomplete="off" style="font-size:15px"><div class="err" id="rerr"></div><button class="btn" style="background:var(--warn)">Azzera l\'app</button></form>'+
    '<button type="button" id="rback" style="margin-top:14px;font-size:14px;color:var(--accent);font-weight:600">Torna indietro</button>');
  document.getElementById("rback").onclick=lockScreen;
  document.getElementById("rf").onsubmit=function(e){ e.preventDefault(); if(this.c.value.trim().toUpperCase()!=="CANCELLA"){ document.getElementById("rerr").textContent="Scrivi CANCELLA per confermare"; return; } resetAll(); };
}

/* --- copia di sicurezza --- */
function importData(file, msg){
  var rd=new FileReader();
  rd.onload=function(){
    var d=null; try{ d=JSON.parse(rd.result); }catch(e){}
    if(!d || d.app!=="agenda-clienti" || !Array.isArray(d.clients)){ msg.textContent="Questo file non è una copia dell'agenda."; return; }
    var nc=d.clients.length, ne=(d.events||[]).length;
    confirmSheet("Importare "+nc+" clienti e "+ne+" appuntamenti? I dati attuali verranno sostituiti.","Importa",function(){
      localAssets.list().then(function(r){ var have={}; (r.assets||[]).forEach(function(a){ have[a.id]=1; }); return have; }, function(){ return {}; }).then(function(have){
        state.clients=d.clients.map(function(c){ c.photos=(c.photos||[]).filter(function(p){return have[p.id];}); c.files=(c.files||[]).filter(function(f){return have[f.id];}); return c; });
        state.events=Array.isArray(d.events)?d.events:[];
        state.shopping=Array.isArray(d.shopping)?d.shopping:[];
        if(d.tpl){ tpl=normTpl(d.tpl); tpl.list.forEach(function(t){ if(ownerName) t.text=t.text; }); cacheTpl(); }
        if(d.name && !ownerName) setOwnerName(d.name);
        save("clients"); render(); toast("Dati importati");
      });
    });
  };
  rd.onerror=function(){ msg.textContent="Non riesco a leggere il file."; };
  rd.readAsText(file);
}
function settingsSheet(){
  openSheet('<h2>Impostazioni</h2>'+
    '<div class="section" style="margin-top:0">Il tuo nome</div>'+
    '<div class="addrow"><input id="nmIn" value="'+esc(ownerName)+'" placeholder="Nome e cognome"><button type="button" id="nmSave" aria-label="Salva">'+ICON_OK.replace('width="16" height="16"','width="20" height="20"')+'</button></div>'+
    '<p style="color:var(--muted);font-size:13px;margin:-4px 2px 4px">Compare nel PDF ("Lista '+esc(ownerName||"…")+'") e nei messaggi al posto di {firma}.</p>'+
    '<div class="section">Cambia password</div><form>'+
    '<label class="field"><span>Password attuale</span><input type="password" inputmode="numeric" pattern="[0-9]*" name="old" autocomplete="current-password"></label>'+
    '<label class="field"><span>Nuova password</span><input type="password" inputmode="numeric" pattern="[0-9]*" name="a" autocomplete="new-password"></label>'+
    '<label class="field"><span>Ripeti la nuova password</span><input type="password" inputmode="numeric" pattern="[0-9]*" name="b" autocomplete="new-password"></label>'+
    '<p id="cerr" style="color:var(--warn);font-size:14px;margin:-4px 0 8px"></p>'+
    '<div class="actions"><button class="btn full">Cambia password</button></div></form>'+
    '<div class="section">Messaggi ai clienti</div><button type="button" class="btn ghost full" id="tplMan">Gestisci messaggi ('+tpl.list.length+')</button>'+
    '<div class="section">Copia di sicurezza</div>'+
    '<div class="actions" style="margin-top:0"><button type="button" class="btn ghost" id="expData" style="flex:1">Esporta</button><div class="btn ghost fbtn" style="flex:1">Importa<input type="file" accept=".json,application/json" id="impIn"></div></div>'+
    '<p id="expMsg" style="color:var(--muted);font-size:13px;margin:8px 0 0">I dati sono solo su questo telefono: fai una copia ogni tanto e salvala (es. su Google Drive o mandala a te stesso). Le foto e i file non sono inclusi nella copia.</p>'+
    '<div class="section">Sicurezza</div><button type="button" class="btn ghost full" id="lockNow">Blocca adesso</button>'+
    '<p style="color:var(--muted);font-size:13px;margin:10px 0 0">L\'app si blocca da sola se resta chiusa per più di 5 minuti.</p>'+
    '<div class="actions" style="margin-top:22px"><button type="button" class="btn ghost full" data-close>Chiudi</button></div>',
  function(d){
    var err=document.getElementById("cerr");
    if(d.a.length<4){ err.textContent="La nuova password deve avere almeno 4 numeri"; return false; }
    if(d.a!==d.b){ err.textContent="Le due nuove password non sono uguali"; return false; }
    hashPw(d.old, pw.salt).then(function(h){
      if(h!==pw.pwHash){ err.textContent="La password attuale è sbagliata"; return; }
      var salt=newSalt();
      return hashPw(d.a, salt).then(function(nh){ pw={pwHash:nh, salt:salt}; cachePw(); closeSheet(); toast("Password cambiata"); });
    });
    return false;
  });
  document.getElementById("nmSave").onclick=function(){ var n=document.getElementById("nmIn").value.trim(); if(!n){ toast("Scrivi il nome"); return; } setOwnerName(n); toast("Nome salvato"); settingsSheet(); };
  document.getElementById("lockNow").onclick=function(){ closeSheet(); lockScreen(); };
  document.getElementById("tplMan").onclick=function(){ tplListSheet(); };
  document.getElementById("expData").onclick=function(){ exportData(document.getElementById("expMsg")); };
  document.getElementById("impIn").addEventListener("change", function(){ var f=this.files&&this.files[0]; if(f) importData(f, document.getElementById("expMsg")); });
}

document.getElementById("gear").onclick=settingsSheet;
lockDecide();

render();
startSync();
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
